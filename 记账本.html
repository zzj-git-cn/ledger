        if (!raw) return;                                   /* 空行直接跳过 */

        if (isNaN(v) || v <= 0){ errs.push('第 ' + (i+1) + ' 行金额不对'); return; }

      writeAutoBackup();                                    /* 存快照 */

      save();
      savedCount += toSave.length;
      render();
      toast('已补录 ' + toSave.length + ' 笔 · 共 ' + db.entries.length + ' 笔');
      offerUndo(ids);
    }

    /* 底部 */
    var foot = el('div','bf-foot');
    var sumBox = el('div','sum');
    foot.appendChild(sumBox);
    var cancel = el('button','cancel','关闭');

    sheet.appendChild(tip);

    for (var i=0;i<3;i++) addRow();
    setTimeout(function(){ var f = list.querySelector('input'); if (f) f.focus(); }, 60);
  });
}

/* 保存后给一个"撤销"入口:ids 为空时表示撤销"恢复备份"这个动作本身 */
function offerUndo(ids, label){
  var wrap = el('div','mask');
  wrap.style.background = 'transparent';
  wrap.style.pointerEvents = 'none';
  wrap.style.alignItems = 'flex-start';
  wrap.style.paddingTop = '24px';
  var bar = el('div','sheet');
  bar.style.maxWidth = '420px';
  bar.style.pointerEvents = 'auto';
  bar.style.padding = '14px 16px';
  bar.style.display = 'flex';
  bar.style.alignItems = 'center';
  bar.style.gap = '12px';
  bar.appendChild(el('span',null, ids.length ? ('已补录 ' + ids.length + ' 笔') : '已恢复备份'));
  var undo = el('button','btn-danger');
  undo.style.marginLeft = 'auto';
  undo.style.padding = '8px 14px';
  undo.style.borderRadius = '10px';
  undo.textContent = label || '撤销本次补录';
  undo.onclick = function(){
    if (ids.length){
      /* 补录撤销:只删这一次补进去的那几笔,其它数据一笔不动 */
      if (!undoSnapshot){ toast('快照已失效','warn'); wrap.remove(); return; }
      if (!window.confirm('撤销这次补录的 ' + ids.length + ' 笔?(只删这些,其它数据不动)')) return;
      var keep = {};
      ids.forEach(function(id){ keep[id] = 1; });
      db.entries = db.entries.filter(function(e){ return !keep[e.id]; });
      save(); render(); wrap.remove();
      toast('已撤销 ' + ids.length + ' 笔');
      return;
    }
    /* 恢复备份的撤销:整份还原回操作前的内存快照 */
    if (!undoSnapshot){ toast('快照已失效','warn'); wrap.remove(); return; }
    if (!window.confirm('要把刚才那次恢复撤回吗?(还原成恢复前的数据)')) return;
    applySnapshot(undoSnapshot);
    wrap.remove();
  };
  var ok = el('button','btn-ghost');
  ok.style.padding = '8px 14px';
  ok.style.borderRadius = '10px';
  ok.textContent = '好';
  ok.onclick = function(){ wrap.remove(); };
  bar.appendChild(undo); bar.appendChild(ok);
  wrap.appendChild(bar);
  document.body.appendChild(wrap);
  setTimeout(function(){ if (wrap.parentNode) wrap.remove(); }, 12000);
}

/* 把内存快照整个还原回去(补录撤销 / 恢复备份撤销 共用) */
function applySnapshot(json){
  var snap = JSON.parse(json);
  var keep = {};
  (snap.entries || []).forEach(function(e){ keep[e.id] = 1; });
  db.entries = (snap.entries || []).map(normEntry);
  save(); render();
  toast('已还原到操作前的状态:' + db.entries.length + ' 笔');
}

/* ============================================================
   扇形图:两级同心环 + 悬浮下一级明细 + 点击跳转筛选
   只做展示与筛选,不写任何数据
   ============================================================ */
var SUN_BASE = { expense:'#8f1d33', income:'#0f6f4f' };   /* 支出深红 / 收入深绿 主题色 */
var SUN_PERIODS = [['today','今日'],['week','本周'],['month','本月'],['all','总览']];

function hexToRgb(h){
  h = String(h).replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), h=0, s=0, l=(mx+mn)/2, d=mx-mn;
  if (d){
    s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    if (mx===r) h = ((g-b)/d + (g<b?6:0))/6;
    else if (mx===g) h = ((b-r)/d + 2)/6;
    else h = ((r-g)/d + 4)/6;
  }
  return [h*360, s*100, l*100];
}
function hslToRgb(h,s,l){
  h = ((h%360)+360)%360; s/=100; l/=100;
  var c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2, r=0,g=0,b=0;
  if (h<60){ r=c; g=x; } else if (h<120){ r=x; g=c; } else if (h<180){ g=c; b=x; }
  else if (h<240){ g=x; b=c; } else if (h<300){ r=x; b=c; } else { r=c; b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function mixHex(hex, white, ratio){          /* 往白/黑方向混,ratio 0~1 */
  var c = hexToRgb(hex), t = white ? [255,255,255] : [8,10,14];
  return '#' + [0,1,2].map(function(i){
    var v = Math.round(c[i] + (t[i]-c[i])*ratio);
    return (v<16?'0':'') + v.toString(16);
  }).join('');
}
function shadeFor(type, idx, total){
  var base = SUN_BASE[type] || '#5b6472';
  var hsl = rgbToHsl.apply(null, hexToRgb(base));
  var n = Math.max(2, total || 6);
  var hue = hsl[0] + (idx - (n-1)/2) * (26/n);          /* 在同色系内轻微偏色,相邻也好区分 */
  var sat = clamp(hsl[1] * (1 - idx*0.045), 26, 82);
  var lig = clamp(hsl[2] + 4 + idx * (30/n), 12, 66);
  return '#' + hslToRgb(hue, sat, lig).map(function(v){ return (v<16?'0':'') + v.toString(16); }).join('');
}
function subShade(parentHex, idx, total){
  var n = Math.max(2, total || 5);
  return mixHex(parentHex, true, clamp(0.18 + (idx+1) * (0.52/n), 0.14, 0.74));
}
function arcPath(cx, cy, r0, r1, a0, a1){    /* 圆环扇区 */
  var large = (a1 - a0) > Math.PI ? 1 : 0;
  var x0 = cx + r1*Math.cos(a0), y0 = cy + r1*Math.sin(a0);
  var x1 = cx + r1*Math.cos(a1), y1 = cy + r1*Math.sin(a1);
  var x2 = cx + r0*Math.cos(a1), y2 = cy + r0*Math.sin(a1);
  var x3 = cx + r0*Math.cos(a0), y3 = cy + r0*Math.sin(a0);
  return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
         ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
         ' L' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
         ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + x3.toFixed(2) + ' ' + y3.toFixed(2) + ' Z';
}
function periodRange(key){
  if (key === 'all') return null;
  return presetRange(key === 'today' ? 'today' : (key === 'week' ? 'week' : 'month'));
}
function periodLabel(key){
  if (key === 'all') return '全部时间';
  var r = periodRange(key);
  return ymd(r[0]) + ' ~ ' + ymd(addDays(r[1], -1));
}

function sunSegments(type, list, t0, t1){
  var roots = CATS[type] || [];
  var totals = {}, grand = 0;
  for (var i=0;i<list.length;i++){
    var e = list[i];
    if (e.type !== type) continue;
    var t = new Date(e.ts).getTime();
    if (t < t0 || t >= t1) continue;
    var rid = catRoot(type, e.cat).id;
    totals[rid] = (totals[rid] || 0) + e.amount;
    grand += e.amount;
  }
  var out = [];
  roots.forEach(function(r, idx){
    var amount = totals[r.id] || 0;
    if (amount <= 0) return;
    out.push({ root:r, amount:amount, color:shadeFor(type, idx, roots.length), type:type, grand:grand });
  });
  out.sort(function(a,b){ return b.amount - a.amount; });
  return { segs:out, grand:grand };
}

function renderSunburst(compactFlag){
  var compact = !!compactFlag;
  var frag = document.createDocumentFragment();
  var p = el('div','panel anim' + (compact ? ' compact' : ''));
  var head = el('div','phead');
  head.appendChild(el('h2',null,'收支构成扇形图'));
  var seg = el('div','seg'); seg.style.marginLeft = 'auto';
  SUN_PERIODS.forEach(function(pair){
    var b = el('button', UI.sunPeriod === pair[0] ? 'on' : '', pair[1]);
    b.onclick = function(){ UI.sunPeriod = pair[0]; render(); };
    seg.appendChild(b);
  });
  head.appendChild(seg);
  p.appendChild(head);

  var t0 = -Infinity, t1 = Infinity;
  var r = periodRange(UI.sunPeriod);
  if (r){ t0 = r[0].getTime(); t1 = r[1].getTime(); }

  var exp = sunSegments('expense', db.entries, t0, t1);
  var inc = sunSegments('income', db.entries, t0, t1);
  var total = exp.grand + inc.grand;

  var wrap = el('div','sun-wrap' + (compact ? ' sm' : ''));
  var canvas = el('div','sun-canvas' + (compact ? ' sm' : ''));
  var center = el('div','sun-center' + (compact ? ' sm' : ''));
  canvas.appendChild(center);
  wrap.appendChild(canvas);

  var side = el('div');
  var bars = el('div','sun-bars');
  side.appendChild(el('div','ttl', compact
    ? '悬浮圆环 = 看这一级的下一级明细;点击扇区 = 下方明细只筛这一类'
    : ('点任意一块 = 下方明细只显示这一类 · 时间跟随上方「' + periodLabel(UI.sunPeriod) + '」')));
  if (!compact) side.appendChild(bars);
  wrap.appendChild(side);
  p.appendChild(wrap);

  function filterTo(catId, type, presetKey){
    UI.cat = catId || 'all';
    UI.type = type || 'all';
    var pk = presetKey || UI.sunPeriod;
    UI.preset = pk === 'all' ? 'all' : pk;
    if (UI.preset === 'all'){ UI.from = ''; UI.to = ''; }
    else { var rr = presetRange(UI.preset); UI.from = ymd(rr[0]); UI.to = ymd(addDays(rr[1], -1)); }
    listScope = 'all'; scopeDay = null;
    render();
    var box = $('.filters');
    if (box) box.scrollIntoView({behavior:'smooth', block:'center'});
  }
  /* 供测试/外部调用 */
  window.__sunAction = { filterTo: filterTo, periodRange: periodRange, sunSegments: sunSegments };

  if (!total){
    canvas.appendChild(el('div','sun-empty','这个时间段还没有记录'));
    side.appendChild(el('div','sun-empty','换个时间看看,或者先记一笔'));
    return p;
  }

  /* ---- 画同心环(用 DOM 直接建 SVG 节点,不拼字符串) ---- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs){
    var n = document.createElementNS ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
    for (var k in attrs){ if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]); }
    return n;
  }
  function segPath(attrs, tipText){
    var p = svgEl('path', attrs);
    p.setAttribute('class', 'sun-seg');
    var ti = svgEl('title');
    ti.textContent = tipText;
    p.appendChild(ti);
    return p;
  }
  var S = compact ? 210 : 300, K = S / 300, C = S / 2;
  var rOut0 = 128*K, rOut1 = 143*K, rIn0 = 70*K, rIn1 = 124*K;
  var svgNode = svgEl('svg', { viewBox: '0 0 ' + S + ' ' + S });
  svgNode.style.transformOrigin = C + 'px ' + C + 'px';
  var a = -Math.PI/2;
  var expFrac = exp.grand / total;
  var expA = a + Math.PI*2*expFrac;

  /* 外环:支出段 + 收入段(深红 / 深绿) */
  if (exp.grand > 0) svgNode.appendChild(segPath({ d: arcPath(C,C,rOut0,rOut1,a,expA), fill: SUN_BASE.expense }, '支出 ' + money(exp.grand) + ' 元'));
  if (inc.grand > 0) svgNode.appendChild(segPath({ d: arcPath(C,C,rOut0,rOut1,expA,a+Math.PI*2), fill: SUN_BASE.income }, '收入 ' + money(inc.grand) + ' 元'));

  /* 内环:各一级分类,占自己那一半,颜色是同色系深浅 */
  [['expense', exp, a, expA], ['income', inc, expA, a+Math.PI*2]].forEach(function(band){
    var type = band[0], pack = band[1], start = band[2], end = band[3];
    if (!pack.grand) return;
    var cur = start, span = end - start;
    pack.segs.forEach(function(s){
      var a0 = cur, a1 = cur + span * (s.amount / pack.grand);
      cur = a1;
      svgNode.appendChild(segPath({
        d: arcPath(C,C,rIn0,rIn1,a0,a1), fill: s.color,
        'data-type': type, 'data-cat': s.root.id
      }, catRoot(type, s.root.id).name + ' ' + money(s.amount) + ' 元'));
    });
  });

  /* 同级之间的分隔线,让色块一眼分开 */
  [exp.segs, inc.segs].forEach(function(segs, bi){
    var start = bi === 0 ? a : expA, end = bi === 0 ? expA : a+Math.PI*2;
    var grand = bi === 0 ? exp.grand : inc.grand;
    if (!grand) return;
    var cur = start;
    segs.forEach(function(s, i){
      if (i > 0){
        var ang = cur;
        svgNode.appendChild(svgEl('line', {
          x1: (C + (rIn0-4*K)*Math.cos(ang)).toFixed(1), y1: (C + (rIn0-4*K)*Math.sin(ang)).toFixed(1),
          x2: (C + (rIn1+3*K)*Math.cos(ang)).toFixed(1), y2: (C + (rIn1+3*K)*Math.sin(ang)).toFixed(1),
          stroke: '#0d111a', 'stroke-width': (1.6*K).toFixed(2), opacity: .75
        }));
      }
      cur += (end - start) * (s.amount / grand);
    });
  });
  /* 内外环之间留一道深色缝 */
  svgNode.appendChild(svgEl('circle', { cx: C, cy: C, r: (rIn1+rOut0)/2, fill: 'none', stroke: '#0d111a', 'stroke-width': (3*K).toFixed(2), opacity: .9 }));
  canvas.insertBefore(svgNode, center);
  canvas.appendChild(center);

  var expPct = total ? (exp.grand/total*100) : 0;
  var incPct = total ? (inc.grand/total*100) : 0;
  center.innerHTML = '';
  center.appendChild(el('div','t','总流水'));
  center.appendChild(el('div','v', money(total)));
  center.appendChild(el('div','n','支出 ' + expPct.toFixed(0) + '% · 收入 ' + incPct.toFixed(0) + '%'));

  /* ---- 悬浮 / 点击交互 ---- */
  var pop = null;
  function closePop(){ if (pop && pop.parentNode) pop.parentNode.removeChild(pop); pop = null; }
  function showPop(type, catId, anchorEl, ev){
    closePop();
    var pack = type === 'expense' ? exp : inc;
    var seg = pack.segs.filter(function(s){ return s.root.id === catId; })[0];
    if (!seg) return;
    var rootName = catRoot(type, catId).name;
    /* 统计这段时间内该一级下面的明细(一级直接记的算"未细分") */
    var r2 = periodRange(UI.sunPeriod);
    var q0 = r2 ? r2[0].getTime() : -Infinity, q1 = r2 ? r2[1].getTime() : Infinity;
    var map = {}, un = 0;
    db.entries.forEach(function(e){
      if (e.type !== type) return;
      var t = new Date(e.ts).getTime();
      if (t < q0 || t >= q1) return;
      if (catRoot(type, e.cat).id !== catId) return;
      var chain = catChain(type, e.cat);
      if (chain.length > 1){
        var sub = chain[1], subId = catId + '.' + sub.id;
        if (!map[subId]) map[subId] = { id:subId, name:sub.name, amount:0 };
        map[subId].amount += e.amount;
      } else un += e.amount;
    });
    var subs = [];
    for (var k in map){ if (Object.prototype.hasOwnProperty.call(map, k)) subs.push(map[k]); }
    subs.sort(function(x,y){ return y.amount - x.amount; });
    if (un > 0) subs.push({ id:catId, name:'未细分', amount:un, isRoot:true });

    var node = el('div','sun-pop');
    var ph = el('div','ph');
    var dot = el('i','dotc'); dot.style.background = seg.color;
    ph.appendChild(dot);
    var nmb = el('b',null,rootName);
    ph.appendChild(nmb);
    var arrow = el('button','arrow','→');
    arrow.title = '只看这一类的明细';
    arrow.onclick = function(ev2){ ev2.stopPropagation(); closePop(); filterTo(catId, type); };
    ph.appendChild(arrow);
    node.appendChild(ph);

    if (subs.length){
      var pl = el('div','pl');
      subs.forEach(function(s){
        var row = el('div','pr');
        var d2 = el('i','dotc');
        d2.style.background = s.isRoot ? seg.color : subShade(seg.color, subs.indexOf(s), subs.length);
        row.appendChild(d2);
        row.appendChild(el('span',null,s.name));
        row.appendChild(el('span','v', money(s.amount)));
        row.appendChild(el('span','p', (pack.grand ? (s.amount/seg.amount*100).toFixed(0) : '0') + '%'));
        row.onclick = function(ev2){
          ev2.stopPropagation();
          if (s.isRoot) filterTo(catId, type);
          else filterTo(s.id, type);
          closePop();
        };
        pl.appendChild(row);
      });
      node.appendChild(pl);
    } else {
      var pl2 = el('div','pl');
      var only = el('div','pr');
      var d3 = el('i','dotc'); d3.style.background = seg.color;
      only.appendChild(d3);
      only.appendChild(el('span',null,'这个分类没有下一级'));
      only.appendChild(el('span','v', money(seg.amount)));
      only.onclick = function(ev2){ ev2.stopPropagation(); filterTo(catId, type); closePop(); };
      pl2.appendChild(only);
      node.appendChild(pl2);
    }
    var pf = el('div','pf');
    pf.appendChild(el('span',null,'占' + (type==='expense'?'支出':'收入') + ' ' + (pack.grand ? (seg.amount/pack.grand*100).toFixed(1) : '0') + '%'));
    pf.appendChild(el('b',null, money(seg.amount) + ' 元'));
    node.appendChild(pf);

    canvas.appendChild(node);
    var cw = S, ch = S;
    var ax = 0, ay = 0;
    if (ev && ev.clientX && canvas.getBoundingClientRect){
      var rc = canvas.getBoundingClientRect();
      ax = ev.clientX - rc.left; ay = ev.clientY - rc.top;
    } else if (anchorEl && anchorEl.getBoundingClientRect){
      var r3 = anchorEl.getBoundingClientRect(), rc2 = canvas.getBoundingClientRect();
      ax = r3.left - rc2.left + r3.width/2; ay = r3.top - rc2.top;
    } else { ax = cw; ay = ch/2; }
    var pw = node.offsetWidth || 240, phh = node.offsetHeight || 140;
    var left = clamp(ax + 14, 4, Math.max(4, cw - pw - 4));
    var top = clamp(ay - phh/2, 4, Math.max(4, ch - phh - 4));
    if (ax > cw * 0.55) left = clamp(ax - pw - 14, 4, Math.max(4, cw - pw - 4));
    node.style.left = left + 'px';
    node.style.top = top + 'px';
    pop = node;
  }

  $$('.sun-seg', svgNode).forEach(function(seg){
    var type = seg.getAttribute('data-type') || null;
    seg.addEventListener('mouseenter', function(ev){
      if (!type){
        /* 外环:展示收支总览 */
        closePop();
        var node = el('div','sun-pop');
        var ph = el('div','ph');
        var d = el('i','dotc'); ph.appendChild(d);
        ph.appendChild(el('b',null, seg.getAttribute('fill') === SUN_BASE.expense ? '支出' : '收入'));
        node.appendChild(ph);
        var pl = el('div','pl');
        [exp, inc].forEach(function(pk, i){
          var row = el('div','pr');
          var dd = el('i','dotc'); dd.style.background = i === 0 ? SUN_BASE.expense : SUN_BASE.income;
          row.appendChild(dd);
          row.appendChild(el('span',null, i === 0 ? '支出合计' : '收入合计'));
          row.appendChild(el('span','v', money(pk.grand)));
          row.appendChild(el('span','p', (total ? (pk.grand/total*100).toFixed(0) : '0') + '%'));
          pl.appendChild(row);
        });
        node.appendChild(pl);
        var pf = el('div','pf');
        pf.appendChild(el('span',null,'净额'));
        pf.appendChild(el('b',null, signed(inc.grand - exp.grand) + ' 元'));
        node.appendChild(pf);
        canvas.appendChild(node);
        var pw0 = node.offsetWidth || 220;
        node.style.left = clamp(S - pw0 - 4, 4, Math.max(4, S - pw0 - 4)) + 'px';
        node.style.top = '6px';
        pop = node;
        return;
      }
      showPop(type, seg.getAttribute('data-cat'), seg, ev);
      $$('.sun-seg', svgNode).forEach(function(s2){ s2.classList.toggle('dim', s2 !== seg && s2.getAttribute('data-cat') !== seg.getAttribute('data-cat')); });
    });
    seg.addEventListener('mouseleave', function(){ /* 由 canvas 的 mouseleave 统一关闭 */ });
    seg.addEventListener('click', function(ev){
      ev.stopPropagation();
      if (!type) return;
      filterTo(seg.getAttribute('data-cat'), type);
      closePop();
    });
  });
  canvas.addEventListener('mouseleave', function(){ closePop(); $$('.sun-seg', svgNode).forEach(function(s2){ s2.classList.remove('dim'); }); });
  document.addEventListener('click', function(){ closePop(); });
  window.__sunPop = { show: showPop, close: closePop, canvas: canvas, svg: svgNode };

  /* ---- 右侧一级排行(紧凑模式不渲染这份长列表,改用下面看板里的"分类排行") ---- */
  if (!compact){
    var maxAmt = Math.max(exp.segs.length ? exp.segs[0].amount : 0, inc.segs.length ? inc.segs[0].amount : 0) || 1;
    var barList = [];
    exp.segs.forEach(function(s, i){ barList.push({ type:'expense', seg:s, idx:i, n:exp.segs.length }); });
    inc.segs.forEach(function(s, i){ barList.push({ type:'income', seg:s, idx:i, n:inc.segs.length }); });
    var shownGroup = 0;
    barList.forEach(function(item){
      if (item.type !== shownGroup){ shownGroup = item.type; var t = el('div','ttl'); t.style.marginTop='10px'; t.textContent = item.type === 'expense' ? '支出分类' : '收入分类'; bars.appendChild(t); }
      var s = item.seg, type = item.type;
      var bar = el('div','sun-bar' + (UI.cat === s.root.id ? ' on' : ''));
      var r1 = el('div','r1');
      var dot = el('i','dotc'); dot.style.background = s.color;
      r1.appendChild(dot);
      r1.appendChild(el('span','nm', s.root.name));
      if (!(s.root.subs && s.root.subs.length)) r1.appendChild(el('span','tag','无下级'));
      r1.appendChild(el('span','vl', money(s.amount)));
      bar.appendChild(r1);
      var band = type === 'expense' ? exp : inc;
      var r2 = el('div','r2');
      var trk = el('div','trk'); var fl = el('div','fl');
      fl.style.background = 'linear-gradient(90deg,' + s.color + ',' + mixHex(s.color, true, .28) + ')';
      trk.appendChild(fl);
      r2.appendChild(trk);
      r2.appendChild(el('div','pc', (band.grand ? (s.amount/band.grand*100).toFixed(0) : '0') + '%'));
      bar.appendChild(r2);
      var r2b = el('div','subs2');
      var r3 = periodRange(UI.sunPeriod);
      var q0 = r3 ? r3[0].getTime() : -Infinity, q1 = r3 ? r3[1].getTime() : Infinity;
      var subMap = {};
      db.entries.forEach(function(e){
        if (e.type !== type) return;
        var t = new Date(e.ts).getTime();
        if (t < q0 || t >= q1) return;
        if (catRoot(type, e.cat).id !== s.root.id) return;
        var ch2 = catChain(type, e.cat);
        if (ch2.length > 1){
          var sid = s.root.id + '.' + ch2[1].id;
          if (!subMap[sid]) subMap[sid] = { name:ch2[1].name, amount:0 };
          subMap[sid].amount += e.amount;
        }
      });
      var subArr = [];
      for (var kk in subMap){ if (Object.prototype.hasOwnProperty.call(subMap, kk)) subArr.push(subMap[kk]); }
      subArr.sort(function(x,y){ return y.amount - x.amount; });
      if (subArr.length) r2b.textContent = subArr.slice(0, 4).map(function(x){ return x.name + ' ' + money(x.amount); }).join(' · ');
      if (subArr.length) bar.appendChild(r2b);
      bar.onclick = function(){ filterTo(s.root.id, type); };
      bar.onmouseenter = function(){ showPop(type, s.root.id, bar, null); };
      bar.onmouseleave = function(){};
      bars.appendChild(bar);
      requestAnimationFrame(function(){ fl.style.width = (s.amount/maxAmt*100).toFixed(1) + '%'; });
    });
  }
  var lg = el('div','legend');
  lg.appendChild(svgLegend(SUN_BASE.expense, '支出(外环)'));
  lg.appendChild(svgLegend(SUN_BASE.income, '收入(外环)'));
  if (!compact) lg.appendChild(el('span',null,'内环 = 各分类在同一主题色里的深浅 · 悬浮看下一级 · 点一下筛明细'));
  p.appendChild(lg);

  /* 底部小数据条:和走势图那块对齐,也把面板下方填平 */
  var sstrip = el('div','mini-stats');
  if (exp.segs.length){
    var e1 = el('span','ms o');
    e1.appendChild(el('span',null,'支出最多'));
    e1.appendChild(el('b',null, exp.segs[0].root.name + ' ' + (exp.grand ? (exp.segs[0].amount/exp.grand*100).toFixed(0) : '0') + '%'));
    sstrip.appendChild(e1);
  }
  if (inc.segs.length){
    var i1 = el('span','ms i');
    i1.appendChild(el('span',null,'收入最多'));
    i1.appendChild(el('b',null, inc.segs[0].root.name + ' ' + (inc.grand ? (inc.segs[0].amount/inc.grand*100).toFixed(0) : '0') + '%'));
    sstrip.appendChild(i1);
  }
  var c1 = el('span','ms');
  c1.appendChild(el('span',null,'涉及分类'));
  c1.appendChild(el('b',null, exp.segs.length + ' 支出 / ' + inc.segs.length + ' 收入'));
  sstrip.appendChild(c1);
  p.appendChild(sstrip);
  return p;
}

function openDataSheet(){  openSheet(function(sheet, close){
    var h = el('h3');
    h.appendChild(el('span',null,'数据管理'));
    var x = el('span','sp','关闭 ✕'); x.onclick = close;
    h.appendChild(x);
    sheet.appendChild(h);

    var info = el('div','sum-line');
    info.appendChild(el('span',null,'共 ' + db.entries.length + ' 笔'));
    var all = sumRange(-Infinity, Infinity);
    info.appendChild(el('span',null,'总收入 ' + money(all.inc)));
    info.appendChild(el('span',null,'总支出 ' + money(all.exp)));
    info.appendChild(el('span',null,'结余 ' + signed(all.net)));
    sheet.appendChild(info);

    /* 预算 / 时薪 设置 */
    var settings = el('div','field');
    settings.style.marginTop = '16px';
    settings.appendChild(el('label', null, '本月预算(元)'));
    var srow = el('div','row');
    var budgetInp = el('input','inp'); budgetInp.type='text'; budgetInp.inputMode='decimal';
    budgetInp.value = db.budget > 0 ? String(db.budget) : '';
    budgetInp.placeholder = '例如 1500';
    var rateInp = el('input','inp'); rateInp.type='text'; rateInp.inputMode='decimal';
    rateInp.value = String(db.hourlyRate || DEFAULT_RATE);
    var rbox = el('div');
    rbox.appendChild(el('label', null, '时薪(元/小时)'));
    rbox.appendChild(rateInp);
    var bbox = el('div');
    bbox.appendChild(el('label', null, '本月预算(元)'));
    bbox.appendChild(budgetInp);
    srow.appendChild(bbox); srow.appendChild(rbox);
    settings.appendChild(srow);
    var saveBtn = el('button','more','保存设置');
    saveBtn.onclick = function(){
      var b = parseAmount(budgetInp.value);
      var r = parseAmount(rateInp.value);
      if (budgetInp.value.trim() !== '' && (isNaN(b) || b <= 0)){ toast('预算要填大于 0 的数字','warn'); return; }
      if (isNaN(r) || r <= 0){ toast('时薪要填大于 0 的数字','warn'); return; }
      db.budget = budgetInp.value.trim() === '' ? 0 : Math.round(b*100)/100;
      db.hourlyRate = Math.round(r*100)/100;
      save(); render(); close();
      toast('设置已保存');
    };
    settings.appendChild(saveBtn);
    sheet.appendChild(settings);

    var stack = el('div','stack');
    stack.style.marginTop='14px';

    /* 补录入口 */
    stack.appendChild(btn('🗓','补录以前几天的账','批量填旧数据,不动现有记录', function(){ close(); openBackfill(); }));

    /* 自动备份状态 + 一键还原 */
    var bk = readAutoBackup();
    var bkText = bk ? ('最近自动备份:' + new Date(bk.savedAt).toLocaleString() + '(' + (bk.entries || []).length + ' 笔)')
                    : '还没有自动备份';
    stack.appendChild(btn('🛟','从自动备份恢复', bkText + ' · 可无损来回切换', function(){
      restoreAutoBackup();
      close();
    }));

    stack.appendChild(btn('📄','导出 CSV(可用 Excel 打开)','带 BOM,中文不乱码', function(){
      var stamp = ymd(new Date());
      download('记账明细_' + stamp + '.csv', csvOf(db.entries), 'text/csv;charset=utf-8');
      toast('已导出 CSV');
    }));
    stack.appendChild(btn('🧩','导出 JSON 备份','完整备份(含设置),可再导入', function(){
      download('记账备份_' + ymd(new Date()) + '.json',
        JSON.stringify({ version:1, exportedAt:new Date().toISOString(), entries:db.entries,
          budget:db.budget, hourlyRate:db.hourlyRate, recentPurposes:db.recentPurposes }, null, 2),
        'application/json');
      toast('已导出备份');
    }));
    stack.appendChild(btn('⬆️','导入 JSON 备份','与现有记录合并(按 id 去重)', function(){
      var inp = document.createElement('input');
      inp.type='file'; inp.accept='.json,application/json';
      inp.onchange = function(){
        var file = inp.files && inp.files[0]; if (!file) return;
        var fr = new FileReader();
        fr.onload = function(){
          try{
            var data = JSON.parse(fr.result);
            var arr = (data && data.entries) ? data.entries : (Array.isArray(data) ? data : null);
            if (!arr) throw new Error('bad');
            var have = {}; db.entries.forEach(function(e){ have[e.id]=1; });
            var add = 0;
            arr.forEach(function(e){ var n=normEntry(e); if (!have[n.id]){ db.entries.push(n); have[n.id]=1; add++; } });
            save(); render(); close();
            toast('导入成功,新增 ' + add + ' 笔');
          }catch(err){ toast('文件格式不对,导入失败','warn'); }
        };
        fr.readAsText(file, 'utf-8');
      };
      inp.click();
    }));
    stack.appendChild(btn('🖨','打印 / 存 PDF','打印当前统计页面', function(){
      close(); setTimeout(function(){ window.print(); }, 200);
    }));
    stack.appendChild(btn('🗑','清空所有数据','不可恢复,先导出备份', function(){
      if (!window.confirm('确定清空全部 ' + db.entries.length + ' 笔记录?此操作不可恢复。')) return;
      if (!window.confirm('再确认一次:真的要清空吗?')) return;
      db.entries = []; db.recentPurposes = []; save(); render(); close(); toast('已清空', 'warn');
    }));
    sheet.appendChild(stack);
  });
}
function btn(icon, title, sub, fn){
  var b = el('button');
  b.appendChild(el('span','ic',icon));
  var tx = el('span','tx');
  tx.appendChild(el('b',null,title));
  tx.appendChild(el('span',null,sub));
  b.appendChild(tx);
  b.onclick = fn;
  return b;
}

/* ============================================================
   事件绑定 + 启动
   ============================================================ */
function go(tab){
  UI.tab = tab;
  if (tab!=='stats') editingId = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function bind(){
  $$('.tab').forEach(function(b){
    b.onclick = function(){ go(b.getAttribute('data-tab')); };
  });
  $('#fabExp').onclick = function(){ go('expense'); };
  $('#fabInc').onclick = function(){ go('income'); };
  $('#btnData').onclick = openDataSheet;
  $('#btnBackfill').onclick = openBackfill;
  $('#btnHelp').onclick = openHelp;
  document.addEventListener('keydown', function(ev){
    if (ev.altKey && !ev.ctrlKey){
      var k = ev.key.toLowerCase();
      if (k==='1'){ ev.preventDefault(); go('stats'); }
      else if (k==='2'){ ev.preventDefault(); go('expense'); }
      else if (k==='3'){ ev.preventDefault(); go('income'); }
      else if (k==='e'){ ev.preventDefault(); go('expense'); }
      else if (k==='i'){ ev.preventDefault(); go('income'); }
    }
  });
}

/* 启动 */
function boot(){
  UI.statType = 'expense';
  calMonth = ymd(new Date()).slice(0,7);
  load().then(function(){
    bind();
    render();
    if (!db.entries.length){
      setTimeout(function(){ toast('欢迎使用 · 点右下角 + 记第一笔',''); }, 500);
    }
  }).catch(function(err){
    bind();
    render();
    toast('读取数据出错,已以空账本启动','warn');
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
